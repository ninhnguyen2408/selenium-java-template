name: Automation Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'         # Mỗi đêm 1:00 AM UTC (8:00 AM GMT+7)

# Cần quyền write để push lên gh-pages branch
permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # Tránh warning Node.js 20 deprecated

jobs:
  run-tests:
    name: Run Selenium Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run TestNG tests
        run: mvn test -Dsurefire.suiteXmlFiles=src/test/resources/suite/CMS.xml
        continue-on-error: true

      - name: Upload raw Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-${{ github.run_number }}
          path: report/AllureReport/
          retention-days: 7

      # Lần đầu chạy gh-pages chưa tồn tại → continue-on-error
      - name: Load Allure history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Generate Allure Report
        uses: simple-elf/allure-report-action@master
        if: always()
        with:
          allure_results: report/AllureReport
          allure_history: allure-history
          keep_reports: 20

      - name: Publish Allure Report to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        if: always()
        with:
          branch: gh-pages
          folder: allure-history
