name: Automation Tests

# =============================================
# TRIGGER: Khi nào pipeline chạy?
# =============================================
on:
  push:
    branches: [ master ]        # Mỗi lần push code lên master
  pull_request:
    branches: [ master ]        # Mỗi lần tạo Pull Request vào master
  workflow_dispatch:             # Cho phép chạy tay trên tab Actions của GitHub
  schedule:
    - cron: '0 1 * * *'         # Tự động chạy mỗi đêm lúc 1:00 AM UTC (8:00 AM GMT+7)

# =============================================
# JOBS: Các công việc trong pipeline
# =============================================
jobs:
  run-tests:
    name: Run Selenium Tests
    runs-on: ubuntu-latest       # Máy ảo Linux của GitHub (miễn phí)

    steps:
      # Bước 1: Tải code từ repository về máy ảo
      - name: Checkout source code
        uses: actions/checkout@v4

      # Bước 2: Cài Java 17 (khớp với pom.xml)
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Bước 3: Cache Maven để lần sau build nhanh hơn
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # Bước 4: Chạy test (CI=true được set tự động bởi GitHub Actions)
      - name: Run TestNG tests
        run: mvn test -Dsurefire.suiteXmlFiles=src/test/resources/suite/CMS.xml
        continue-on-error: true   # Pipeline không fail dù test fail — vẫn tạo report

      # Bước 5: Generate Allure HTML report
      - name: Generate Allure Report
        uses: simple-elf/allure-report-action@master
        if: always()
        with:
          allure_results: report/AllureReport
          allure_report: allure-report

      # Bước 6: Upload Allure HTML report (tải về xem offline)
      - name: Upload Allure HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report-${{ github.run_number }}
          path: allure-report/
          retention-days: 14

      # Bước 7: Upload screenshots + surefire (backup debug)
      - name: Upload Screenshots & Surefire
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-artifacts-${{ github.run_number }}
          path: |
            report/Screenshots/
            target/surefire-reports/
          retention-days: 7
